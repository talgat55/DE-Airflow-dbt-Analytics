version: 2

models:
  - name: mart_daily_sales
    columns:
      - name: sales_date
        data_tests:
          - unique
          - not_null

      - name: revenue
        data_tests:
          - not_null

  - name: mart_product_performance
    columns:
      - name: product_key
        data_tests:
          - unique
          - not_null

      - name: revenue
        data_tests:
          - not_null

  - name: mart_customer_ltv
    columns:
      - name: customer_key
        data_tests:
          - unique
          - not_null

      - name: lifetime_value
        data_tests:
          - not_null