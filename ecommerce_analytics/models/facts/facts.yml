version: 2

models:
  - name: fact_order_items
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null

      - name: order_id
        data_tests:
          - not_null

      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key

      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

      - name: quantity
        data_tests:
          - not_null

      - name: line_total
        data_tests:
          - not_null